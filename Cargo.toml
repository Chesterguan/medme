[workspace]
resolver = "2"
members = ["packages/core-model", "packages/parser", "packages/deid", "packages/terminology", "packages/pipeline", "packages/ocr", "packages/dicom", "packages/share", "packages/sync", "apps/cli", "apps/desktop/src-tauri"]
# Flutter 移动端(P1+)的 FRB rust crate 自成一体、由 cargokit 为 iOS/安卓单独构建,
# 不进桌面 workspace(否则 host `cargo build --workspace` 会去编它)。它经 path 依赖
# 复用 packages/* 数据核。
# fuzz/ 需要 nightly + cargo-fuzz 自己的 profile,进 workspace 会污染日常构建。
exclude = ["apps/mobile_flutter/rust", "fuzz"]

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
hmac = "0.13"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
jieba-rs = "0.10"
pdf-extract = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
lopdf = "0.44"

[profile.release]
# Strip symbols from release binaries/.so's — the main lever for a slim
# mobile release build (debug builds were 400MB+ unstripped). Defaults for
# everything else (opt-level 3, no LTO) are sane; not over-tuning further.
strip = true

# Debug 档也把依赖按优化编译(ONNX Runtime、Argon2、image 等算力活在 opt-level 0 下慢 10 倍+,
# 模拟器/调试包上 OCR 和解锁根本没法测)。只对依赖和 ocr 生效,自己的代码仍是快编译 + 调试断言。
# 依赖只编一次就缓存,不影响日常增量构建。WORKLIST A26。
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ocr]
opt-level = 3

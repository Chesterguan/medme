name: Mobile (Flutter)

# 纪律:日常开发在本地跑单平台 debug + `flutter analyze`。
# 完整 Rust release 跨平台编译是发布流程,只在这里(CI)做,带缓存。
# - PR:只跑轻量 analyze(不编 Rust release),堵住"移动端无 CI"的缺口。
# - release:手动 workflow_dispatch 触发,产出安卓全 ABI + iOS archive/TestFlight。

on:
  pull_request:
    paths:
      - "apps/mobile_flutter/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "要出的包"
        type: choice
        options: [android, ios, both]
        default: both
      upload_testflight:
        description: "iOS 是否上传 TestFlight(需已配好 secrets)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  WORKDIR: apps/mobile_flutter

jobs:
  # ── 轻量门禁:每个改动移动端的 PR 都跑,只做静态分析 + 单元测试,不编 Rust release ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 # TODO: 按仓库惯例改成 SHA 钉版
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pub get
        working-directory: ${{ env.WORKDIR }}
        run: flutter pub get
      - name: flutter analyze
        working-directory: ${{ env.WORKDIR }}
        run: flutter analyze
      - name: dart 单元测试
        working-directory: ${{ env.WORKDIR }}
        run: flutter test

  # ── 安卓 release:arm64-v8a,产出可安装 APK(正式签名)+ 发布到 GitHub Release ──
  android-release:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 APK 到 GitHub Release(落地页指向 releases/latest,防公开下载停在旧版)
    # 提到 job 级是因为 `secrets` 在 step 级 `if` 里不可用,只能经 env 判空。
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      # 关键:workspaces 指向真实 Rust workspace + 真实 target,否则 cargokit 会在别处重编
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/mobile_flutter/rust -> target
          shared-key: flutter-rust-android
      - name: pub get
        working-directory: ${{ env.WORKDIR }}
        run: flutter pub get
      # 正式签名。keystore 以 base64 存在 Secrets 里,现写成文件;Secret 缺失时整步跳过,
      # build.gradle.kts 会自动退回 debug 签名(本地开发同理)。
      # **安卓 App Links 只认正式签名的指纹**,debug 签的包深链不会直接唤起。
      #
      # 注:`secrets` 在 step 级 `if` 里不可用(GitHub 会报 Unrecognized named-value),
      # 所以先经 job 级 env 落一层,再用 `env.` 判空。
      - name: Write release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$WORKDIR/android/app/medme-release.jks"
          # .properties 里 '#' 只有行首才是注释,值后面不能跟内联注释。
          # storeFile 相对 android/app/(Gradle 模块目录),不是 android/。
          cat > "$WORKDIR/android/key.properties" <<EOF
          storeFile=medme-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
          echo "release keystore written"
      - name: 构建 release APK(仅 arm64-v8a)
        working-directory: ${{ env.WORKDIR }}
        # PP-OCR 引擎(oar-ocr/ort)+ 打包的 libc++_shared.so 目前只支持 arm64-v8a
        # (ort 预编译 + libc++ 都只做了 arm64),其它 ABI 会构建失败或真机崩溃 ——
        # 所以 **main 公开发布也只出 arm64-v8a**,与测试分支一致(落地页已注明
        # 「需 64 位手机 arm64」)。补 armeabi-v7a/x86_64 需给每个 ABI 备 ort 预编译
        # + libc++,另做。appbundle(Play 用)需全 ABI,故 Play 上架前不产出。
        # 行为分析的 Key 从 secrets 注入。**没配 secret 时 dart-define 传空串,
        # App 里 `Analytics.isConfigured` 为 false,SDK 整个不启动** —— 所以
        # 这一行在没有 secret 的 fork/PR 构建里也安全,不会失败。
        run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
          --dart-define=MEDME_UPLOAD_TOKEN=${{ secrets.MEDME_UPLOAD_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # TODO: SHA 钉版
        with:
          name: medme-android
          path: ${{ env.WORKDIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      # ── 关键:把 APK 发布到 GitHub Release,资产名与落地页链接一致(MedMe-Android.apk)。──
      # 落地页指向 releases/latest/download/MedMe-Android.apk,所以只要每次构建都更新 latest
      # release 的这个资产,公开下载就永远是最新版 —— 堵住"官网下到旧版"的系统性缺口。
      # 用 gh CLI(runner 自带),不引第三方 action;仅 workflow_dispatch 触发,PR 不发布。
      - name: 发布 APK 到 GitHub Release(落地页取 latest,仅 main)
        # 只有 main 才发布到公开 Release(落地页 releases/latest 指向它)。测试分支
        # 只上传 artifact 供内部真机测,绝不把未验收的测试包推给公开下载。
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${WORKDIR}/build/app/outputs/flutter-apk/app-release.apk" MedMe-Android.apk
          VER="$(grep '^version:' "${WORKDIR}/pubspec.yaml" | sed 's/version:[[:space:]]*//; s/+.*//')"
          TAG="v${VER}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MedMe 医我 ${VER}" \
              --notes "自动发布(workflow_dispatch)· 安卓 APK(arm64-v8a)。桌面/iOS 见各自渠道。" --latest
          fi
          gh release upload "$TAG" MedMe-Android.apk --clobber
          gh release edit "$TAG" --latest
          echo "已发布 $TAG:MedMe-Android.apk(落地页 releases/latest 即刻指向本包)"

  # ── iOS release:archive + 导出 IPA(可选上传 TestFlight)。需配签名 secrets(见文末) ──
  ios-release:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'both')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 选最新 Xcode(App Store Connect 要求 iOS 26 SDK / Xcode 26+)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "使用 $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/mobile_flutter/rust -> target
          shared-key: flutter-rust-ios
      - name: 导入签名证书 + 描述文件
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12
          PP=$RUNNER_TEMP/pp.mobileprovision
          KC=$RUNNER_TEMP/signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: 写 ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>49G34P23QP</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.medme.mobile</key><string>MedMe App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
      - name: pub get
        working-directory: ${{ env.WORKDIR }}
        run: flutter pub get
      - name: 构建 IPA(release archive + 导出)
        working-directory: ${{ env.WORKDIR }}
        # permission_handler(SPM 集成)靠环境变量决定编译哪些权限,优先级高于扫
        # Info.plist —— 后者在 CI 干净环境下路径回溯不可靠(诊断实测:构建期扫不到
        # 我们的 Info.plist,相机权限被默认关闭 → .request() 直接 denied、不弹框)。
        # 显式 export 强制启用相机 + 相册,确定性,不依赖路径。
        env:
          PERMISSION_CAMERA: "1"
          PERMISSION_PHOTOS: "1"
        # `--dart-define` 见安卓那步的说明:没配 secret 就传空串,分析整个不启动。
        run: >-
          flutter build ipa --release
          --export-options-plist=$RUNNER_TEMP/ExportOptions.plist
          --dart-define=POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
          --dart-define=MEDME_UPLOAD_TOKEN=${{ secrets.MEDME_UPLOAD_TOKEN }}
      # ⚠️ **依赖漂移哨兵。** iOS 插件走 Swift Package Manager(不是 CocoaPods ——
      # Podfile.lock 里只有 5 个 pod 是对的,别再以为它「不完整」)。而 `file_picker`
      # 的 Package.swift 把 DKImagePickerController 依赖成 **branch** 而非 tag,
      # DKCamera / DKPhotoGallery 更是直接钉在 `master` 上。SPM 对 branch 型 pin 会在
      # 每次解析时回远端重新校验 —— 于是**对方推一次 commit,我们的二进制就变,而我们
      # 这边一个字都没改**。
      #
      # 实证:build 49 与 50 源码只差 Info.plist 和版本号,50 的 Runner 却多引用了
      # `requestAlwaysAuthorization`,苹果因此回了 ITMS-90683。
      #
      # 治本要么给 xcodebuild 传 `-disableAutomaticPackageResolution`(flutter build ipa
      # 没有透传口子),要么把 file_picker 换掉/固定住。在那之前**至少让它可见**:
      # 构建后 Package.resolved 变了就红,逼一次人工判断,而不是悄悄换个二进制发出去。
      - name: 核对 SPM 依赖没有在构建中漂移
        working-directory: ${{ env.WORKDIR }}
        run: |
          if ! git diff --exit-code -- ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::error::构建过程中 SPM 重新解析了依赖(上方 diff)。这次的产物与上一次不是同一组第三方代码——先确认改了什么、再决定要不要提交新的 Package.resolved。"
            exit 1
          fi
          echo "✓ Package.resolved 与提交时一致"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medme-ios-ipa
          path: ${{ env.WORKDIR }}/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: 上传 TestFlight(可选)
        if: inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          # altool 有个坑:上传失败(如 build number 撞车)会打印 ERROR 但仍 exit 0,
          # 导致这步「假成功」。所以除了 pipefail,还显式扫输出里的 ERROR,命中即失败。
          xcrun altool --upload-app --type ios \
            -f "${{ env.WORKDIR }}"/build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/altool.log
          if grep -qE "ERROR|Failed to upload package" /tmp/altool.log; then
            echo "::error::TestFlight 上传失败(见上方 altool ERROR)"
            exit 1
          fi

# ── iOS release 需要的 GitHub Secrets(用户在 repo Settings → Secrets → Actions 加)──
#   IOS_CERT_P12_BASE64            Apple Distribution 证书导出的 .p12,base64(`base64 -i cert.p12`)
#   IOS_CERT_P12_PASSWORD          导出 .p12 时设的密码
#   IOS_PROVISIONING_PROFILE_BASE64  "MedMe App Store" 描述文件 .mobileprovision,base64
#   IOS_KEYCHAIN_PASSWORD          任意临时钥匙串密码(CI 内自建自用)
#   ASC_KEY_ID / ASC_ISSUER_ID     App Store Connect API key 的 Key ID / Issuer ID
#   ASC_API_KEY_BASE64             该 API key 的 .p8 文件 base64(勿提交到仓库)

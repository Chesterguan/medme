[package]
name = "ocr"
version = "0.1.0"
edition = "2021"

[dependencies]
# `download-binaries` + `simd` are oar-ocr's own defaults (we spell them out so
# `default-features = false` here doesn't drop them). `download-binaries` is what
# makes `ort`/ONNX Runtime a *static, self-contained* native lib fetched at BUILD
# time (per target) and linked into the final binary -- no runtime download of the
# runtime. `auto-download` (fetching the OCR *model* files into ~/.oar at run time)
# is split into its own feature below so a packaged/offline build can supply the
# models itself. Mobile does not build this crate at all -- see the note below.
oar-ocr = { version = "0.8.0", default-features = false, features = [
    "download-binaries",
    "simd",
], optional = true }
image = "0.25"
imageproc = "0.27"
anyhow.workspace = true
lopdf.workspace = true
# Per-page text-layer extraction for mixed PDFs (some pages printed/real text,
# others scanned images) -- `extract_text_from_mem_by_pages` is the one public
# API that gives page-scoped text instead of one whole-document blob, which is
# what `recognize_pdf_mixed` needs to decide *which pages* actually need OCR.
pdf-extract.workspace = true

[dev-dependencies]

[features]
# `engine` pulls in `oar-ocr` (PP-OCRv5 via ONNX Runtime / `ort`), which
# statically bundles the ONNX Runtime library -- hundreds of MB unstripped,
# still tens of MB stripped. On by default so desktop/CLI and this crate's own
# preprocess tests keep full local-OCR support unchanged. Two orthogonal knobs:
#
#   * `engine`        -- links oar-ocr + ONNX Runtime (the actual recognizer).
#                        `ort`'s prebuilt runtime is fetched *at build time* per
#                        target (incl. aarch64-linux-android) and linked
#                        statically -- no runtime download of the runtime.
#   * `auto-download` -- fetches the PP-OCRv5 *model* files into $OAR_HOME
#                        (~/.oar) the first time OCR runs. Needs a writable home.
#
# **Mobile DOES use this crate** (this paragraph used to say the opposite --
# it predates ADR 0006 / the Android PP-OCR switch and misled at least one
# verification round; read the two Cargo.tomls, not this history).
# `apps/mobile_flutter/rust/Cargo.toml` declares a direct
# `cfg(any(target_os = "ios", all(target_os = "android", target_arch =
# "aarch64")))` dependency on us with `default-features = false, features =
# ["engine"]`, i.e. PP-OCRv5 links into the shipped iOS + arm64-Android
# binaries; `auto-download` stays off and the models are packaged and pointed
# at via `set_model_dir` (`api::vault::ensure_pp_models_ready`).
#
# Two consequences worth spelling out, because both bite:
#   * Cargo unifies features per crate, so `pipeline`'s
#     `default-features = false` dep on us does NOT keep `engine` out of the
#     mobile build -- `pipeline::ingest_pdf` -> `ocr::recognize_pdf_mixed` ->
#     `recognize_platform_best` really does reach the ONNX recognizer there.
#   * `set_model_dir` is first-come-first-served and must run before the first
#     recognize call; whoever calls the engine first decides.
#
# Desktop/CLI keep `default = ["engine", "auto-download"]` (models out of
# $OAR_HOME) and pick their platform-native primary engine by `target_os`
# (macOS = Apple Vision, Windows = Windows.Media.Ocr) -- see
# `recognize_platform_best`. Without `engine`,
# `recognize_platform_best`/`recognize_pdf_platform_best` still compile and
# return an error ("OCR not available"); callers already treat OCR failure as
# non-fatal (pipeline stores the file with no extracted text).
default = ["engine", "auto-download"]
engine = ["dep:oar-ocr"]
auto-download = ["oar-ocr?/auto-download"]
# Exposes `ocr::testing`'s multi-page-TIFF fixture builders to *other* crates'
# tests (`pipeline` enables it from `[dev-dependencies]`). Off by default, and
# `#[cfg(any(test, feature = "testing"))]` on the module itself keeps the
# builders out of every shipping build.
testing = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
pollster = "1.0.1"
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization", "Foundation_Collections"] }

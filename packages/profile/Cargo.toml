[package]
name = "profile"
version = "0.1.0"
edition = "2021"
description = "病程档案规则引擎:病种包的加载/验签/缓存,以及从保险箱数据算出 ProfileView 的纯函数。不碰网络。"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# 取值窗口按日期算;与 parser 用同一份 NaiveDate,免得两边日期类型不通。
chrono = { workspace = true }
# 规则引擎吃的是 parser 已经汇总好的序列/用药(不自己再实现一遍分组与单位换算),
# 以及 deid 解出来的 facts(schema 2)。两者都是纯计算,不带 IO。
parser = { path = "../parser" }
deid = { path = "../deid" }
# 包里规则写的 `canonical_unit` 要和序列的规范单位按同一套规则比(`10^9/L` 和
# `10*9/L` 是同一个单位);定性阳性那条还要把原始行的项名解成 analyte key。
terminology = { path = "../terminology" }
# 包签名:防的是 CDN/桶被改后往规则里塞东西(spec §2)。只用验签,不在客户端签名。
ed25519-dalek = "3"
# 与 packages/share 同版本,免得 workspace 里同时编两份 base64。
base64 = "0.23"

[dev-dependencies]
# 测试要临时生成一对密钥来签,生产路径只验签。
ed25519-dalek = { version = "2", features = ["rand_core"] }
# 缓存测试要一个临时目录,读写完随进程退出自动清理。
tempfile.workspace = true
# repo_packages_verify 集成测试要解析 skills/index.json。
serde_json = { workspace = true }
